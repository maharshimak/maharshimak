[project]
name = "makma-ai-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141.1,<1","uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9","httpx>=0.28,<1","ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
