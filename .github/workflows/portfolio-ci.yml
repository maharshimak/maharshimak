name: Profile Contract CI

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - ".github/workflows/portfolio-ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - ".github/workflows/portfolio-ci.yml"
      - "portfolio-projects/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate canonical repository links and single source of truth
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          repositories = [
              "makma-ai-os",
              "agentic-rag-engine",
              "multimodal-ai-studio",
              "knowledge-twin",
              "clinical-document-intelligence",
              "secure-data-copilot",
              "llm-eval-observability",
              "mlops-control-plane",
              "mlops-production-pipeline",
          ]
          missing = [
              name
              for name in repositories
              if f"github.com/maharshimak/{name}" not in readme
          ]
          if missing:
              raise SystemExit("README is missing canonical repositories: " + ", ".join(missing))
          if Path("portfolio-projects").exists():
              raise SystemExit(
                  "portfolio-projects must not return; standalone repositories are canonical."
              )
