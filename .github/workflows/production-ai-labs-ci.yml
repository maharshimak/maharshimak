name: Production AI Labs CI

on:
  push:
    branches: ["main"]
    paths:
      - "portfolio-projects/secure-data-copilot/**"
      - "portfolio-projects/llm-eval-observability/**"
      - "portfolio-projects/mlops-control-plane/**"
      - ".github/workflows/production-ai-labs-ci.yml"
  pull_request:
    paths:
      - "portfolio-projects/secure-data-copilot/**"
      - "portfolio-projects/llm-eval-observability/**"
      - "portfolio-projects/mlops-control-plane/**"

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - secure-data-copilot
          - llm-eval-observability
          - mlops-control-plane

    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
