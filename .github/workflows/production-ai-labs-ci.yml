name: Production AI Labs CI

on:
  push:
    branches: ["main"]
    paths:
      - "portfolio-projects/secure-data-copilot/**"
      - "portfolio-projects/llm-eval-observability/**"
      - "portfolio-projects/mlops-control-plane/**"
      - ".github/workflows/production-ai-labs-ci.yml"
  pull_request:
    paths:
      - "portfolio-projects/secure-data-copilot/**"
      - "portfolio-projects/llm-eval-observability/**"
      - "portfolio-projects/mlops-control-plane/**"
      - ".github/workflows/production-ai-labs-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - secure-data-copilot
          - llm-eval-observability
          - mlops-control-plane

    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.project }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio-projects/${{ matrix.project }}/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist

      - name: Build container
        run: docker build -t "${{ matrix.project }}:ci" .
